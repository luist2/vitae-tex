name: vitaetex

services:
  app:
    build:
      context: .
      target: development
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app
    environment:
      SERVER_NAME: ":8000"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: vitaetex
      DB_USERNAME: vitaetex
      DB_PASSWORD: vitaetex
      DB_SSLMODE: disable
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/app
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
      - /data:rw,nosuid,nodev,mode=1777
      - /config:rw,nosuid,nodev,mode=1777
      - /var/cache/tectonic/fontconfig:rw,nosuid,nodev,noexec,mode=1777
    depends_on:
      postgres:
        condition: service_healthy

  node:
    image: node:24.18.0-bookworm-slim@sha256:6f7b03f7c2c8e2e784dcf9295400527b9b1270fd37b7e9a7285cf83b6951452d
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app
    command: npm run dev
    environment:
      APP_URL: "${APP_URL:-http://localhost:8000}"
      VITE_DEV_SERVER_URL: "http://localhost:${VITE_PORT:-5173}"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/app

  app-e2e:
    profiles: [e2e]
    build:
      context: .
      target: development
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app
    command:
      - sh
      - -c
      - php artisan config:clear && php artisan migrate:fresh --force && exec frankenphp run --config /etc/caddy/Caddyfile
    environment:
      SERVER_NAME: ":8000"
      APP_ENV: e2e
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      APP_DEBUG: "false"
      APP_URL: http://app-e2e:8000
      CACHE_STORE: array
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: vitaetex_test
      DB_USERNAME: vitaetex
      DB_PASSWORD: vitaetex
      DB_SSLMODE: disable
      LOG_CHANNEL: stderr
      LOG_LEVEL: error
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SECURITY_CSP_ENABLED: "false"
      SECURITY_HSTS_MAX_AGE: 0
      SESSION_DRIVER: database
      TRUSTED_HOSTS: app-e2e
    volumes:
      - .:/app
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
      - /data:rw,nosuid,nodev,mode=1777
      - /config:rw,nosuid,nodev,mode=1777
      - /var/cache/tectonic/fontconfig:rw,nosuid,nodev,noexec,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://app-e2e:8000/up"]
      interval: 2s
      timeout: 2s
      retries: 30

  browser-e2e:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    init: true
    ipc: host
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app
    command: npm run test:e2e
    environment:
      CI: "true"
      PLAYWRIGHT_BASE_URL: http://app-e2e:8000
    volumes:
      - .:/app
    depends_on:
      app-e2e:
        condition: service_healthy

  postgres:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    environment:
      POSTGRES_DB: vitaetex
      POSTGRES_USER: vitaetex
      POSTGRES_PASSWORD: vitaetex
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitaetex -d vitaetex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
