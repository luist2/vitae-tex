name: Clear expired password reset tokens

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clear-expired-password-resets
  cancel-in-progress: false

jobs:
  clear-expired-password-resets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_URL: ${{ secrets.NEON_MAINTENANCE_DATABASE_URL }}
      DB_SSLMODE: require
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          tools: composer:2
          coverage: none

      - name: Generate ephemeral application key
        run: |
          ephemeral_key="$(php -r 'echo "base64:".base64_encode(random_bytes(32));')"
          printf 'APP_KEY=%s\n' "$ephemeral_key" >> "$GITHUB_ENV"

      - name: Require maintenance database secret
        run: test -n "$DB_URL"

      - name: Install production dependencies
        run: >-
          composer install
          --no-dev
          --no-interaction
          --no-progress
          --prefer-dist
          --optimize-autoloader

      - name: Clear expired password reset tokens
        run: php artisan auth:clear-resets --no-interaction
